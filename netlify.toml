[build]
  command = "npm run build"
  publish = "_site"

# Category keys merged by the alias fix (2026 redesign): the old split
# section URLs permanently forward to their canonical sections.
[[redirects]]
  from = "/category/sports-analysis/*"
  to = "/category/sports/"
  status = 301

[[redirects]]
  from = "/category/sports-business/*"
  to = "/category/sports/"
  status = 301

[[redirects]]
  from = "/category/public-health/*"
  to = "/category/health-and-medicine/"
  status = 301
